model:
  name: tencent-youtu-llm-2b-q8
  family: Tencent Youtu-LLM
  backend: llama.cpp
  model_ref: tencent/Youtu-LLM-2B-GGUF:Q8_0
  quantization: Q8_0

server:
  base_url: http://127.0.0.1:8080/v1
  host: 127.0.0.1
  port: 8080

runtime:
  launch_mode: hf_text_gguf
  ctx_size: 1024
  n_gpu_layers: 99
  model_ref_env: MODEL_REF
  model_file: Youtu-LLM-2B-Q8_0.gguf
  wsl_script: null
  jetson_script: scripts/jetson/run_hf_gguf_llama_docker.sh

capabilities:
  text: true
  image: false
  audio: false

notes:
  status: Text-only official Tencent Youtu-LLM 2B Q8_0 GGUF candidate. Use the text/router benchmark lane only; do not compare it against image or fake-stream VLM rows.
