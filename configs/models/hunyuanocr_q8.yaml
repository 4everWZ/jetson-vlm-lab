model:
  name: hunyuanocr-q8
  family: HunyuanOCR
  backend: llama.cpp
  model_ref: ggml-org/HunyuanOCR-GGUF:Q8_0
  quantization: Q8_0

server:
  base_url: http://127.0.0.1:8080/v1
  host: 127.0.0.1
  port: 8080

runtime:
  launch_mode: hf_gguf_with_mmproj
  ctx_size: 1024
  n_gpu_layers: 99
  model_ref_env: MODEL_REF
  model_file: HunyuanOCR-Q8_0.gguf
  mmproj_file: mmproj-HunyuanOCR-Q8_0.gguf
  wsl_script: null
  jetson_script: scripts/jetson/run_hf_gguf_vlm_llama_docker.sh

capabilities:
  text: true
  image: true
  audio: false

notes:
  status: Load-path evidence only. Uses ggml-org's GGUF quantization of Tencent HunyuanOCR 1B with Q8_0 model and mmproj files downloaded to MODEL_DIR before local -m/--mmproj launch. This is a Tencent-base GGUF route, not an official Tencent-owned GGUF artifact; the Jetson smoke loaded after launcher-resume recovery but failed the guard with repetitive punctuation output, so do not rank or repeat without quality triage.
