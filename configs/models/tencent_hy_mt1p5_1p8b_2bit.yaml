  family: Tencent Hy-MT1.5
  backend: llama.cpp
  model_ref: tencent/Hy-MT1.5-1.8B-2bit-GGUF:2bit
  quantization: 2bit

server:
  base_url: http://127.0.0.1:8080/v1
  host: 127.0.0.1
  port: 8080

runtime:
  launch_mode: hf_text_gguf
  ctx_size: 1024
  n_gpu_layers: 99
  model_ref_env: MODEL_REF
  model_file: Hy-MT1.5-1.8B-2bit.gguf
  wsl_script: null
  jetson_script: scripts/jetson/run_hf_gguf_llama_docker.sh

capabilities:
  text: true
  image: false
  audio: false

notes:
  status: Text-only Tencent Hy-MT1.5 1.8B low-bit GGUF canary from the 2026-05-31 refresh. Use only as a scoped runtime-compatibility check until a pinned llama.cpp runtime is shown to support the low-bit GGUF tensor types; do not compare it against image or fake-stream VLM rows.
