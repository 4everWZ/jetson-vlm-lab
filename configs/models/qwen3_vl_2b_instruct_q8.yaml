model:
  name: qwen3-vl-2b-instruct-q8
  family: Qwen3-VL
  backend: llama.cpp
  model_ref: Qwen/Qwen3-VL-2B-Instruct-GGUF:Q8_0
  quantization: Q8_0

server:
  base_url: http://127.0.0.1:8080/v1
  host: 127.0.0.1
  port: 8080

runtime:
  launch_mode: hf_gguf_with_mmproj
  ctx_size: 1024
  n_gpu_layers: 99
  model_ref_env: MODEL_REF
  model_file: Qwen3VL-2B-Instruct-Q8_0.gguf
  mmproj_file: mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
  wsl_script: null
  jetson_script: scripts/jetson/run_hf_gguf_vlm_llama_docker.sh

capabilities:
  text: true
  image: true
  audio: false

notes:
  status: >
    Candidate only. Uses Qwen/Qwen3-VL-2B-Instruct-GGUF Q8_0 model and mmproj
    files downloaded to MODEL_DIR, then loaded as local -m/--mmproj files
    because the pinned Jetson llama.cpp container lacks HTTPS support for
    direct -hf downloads. This is the Q8 fallback lane for the <=2B Instruct
    VLM when the Q4_K_M row is unavailable or unusable under the conservative
    Jetson gate. Strict-gate smoke
    qwen3-instruct-q8-smoke-20260609T082222Z still skipped at preflight with
    `lfb 106x4MB` under `--min-lfb-blocks 150`, but the relaxed-gate smoke
    qwen3-instruct-q8-smoke-lfb100-20260609T082321Z passed 6/6 formal records
    and 1/1 fake-stream record with guard pass at `--min-lfb-blocks 100`,
    reaching 31.076 text tok/s, 25.997 image tok/s, and 2.142 s fake-stream
    latency. That run included a first-download artifact phase of 323.05 s, so
    treat it as diagnostic fallback evidence rather than default ranking
    evidence.
