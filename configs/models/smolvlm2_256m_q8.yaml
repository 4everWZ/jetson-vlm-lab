model:
  name: smolvlm2-256m-q8
  family: SmolVLM2
  backend: llama.cpp
  model_ref: ggml-org/SmolVLM2-256M-Video-Instruct-GGUF:Q8_0
  quantization: Q8_0

server:
  base_url: http://127.0.0.1:8080/v1
  host: 127.0.0.1
  port: 8080

runtime:
  launch_mode: hf_gguf_with_mmproj
  ctx_size: 512
  n_gpu_layers: 99
  model_ref_env: MODEL_REF
  wsl_script: null
  jetson_script: scripts/jetson/run_hf_gguf_vlm_llama_docker.sh

capabilities:
  text: true
  image: true
  audio: false

notes:
  status: Candidate only. Uses the llama.cpp-compatible GGUF repository ggml-org/SmolVLM2-256M-Video-Instruct-GGUF with Q8_0 model and mmproj files loaded through -hf. Not yet observed on this repo's Jetson; first acceptance path is startup plus formal benchmark and three-frame fake-stream JSONL.
