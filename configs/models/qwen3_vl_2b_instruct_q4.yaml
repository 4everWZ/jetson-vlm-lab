model:
  name: qwen3-vl-2b-instruct-q4
  family: Qwen3-VL
  backend: llama.cpp
  model_ref: Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M
  quantization: Q4_K_M

server:
  base_url: http://127.0.0.1:8080/v1
  host: 127.0.0.1
  port: 8080

runtime:
  launch_mode: hf_gguf_with_mmproj
  ctx_size: 1024
  n_gpu_layers: 99
  model_ref_env: MODEL_REF
  model_file: Qwen3VL-2B-Instruct-Q4_K_M.gguf
  mmproj_file: mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
  wsl_script: null
  jetson_script: scripts/jetson/run_hf_gguf_vlm_llama_docker.sh

capabilities:
  text: true
  image: true
  audio: false

notes:
  status: >
    Candidate only. Uses Qwen/Qwen3-VL-2B-Instruct-GGUF Q4_K_M with the Q8_0
    mmproj downloaded to MODEL_DIR, then loaded as local -m/--mmproj files
    because the pinned Jetson llama.cpp container lacks HTTPS support for
    direct -hf downloads. Added as a Q4-first <=2B VLM comparison against
    Qwen3-VL 2B Thinking. Diagnostic Jetson smoke
    qwen3-instruct-q4-smoke-lfb32-20260609T075208Z passed guard plus
    fake-stream at relaxed min-lfb-blocks 32, but strict min-lfb-blocks 150
    reruns still skip at preflight after cache-drop plus compact-memory prep
    (`lfb 46x4MB` on 2026-06-09T07:46Z and `lfb 117x4MB` on
    2026-06-09T08:11Z), so keep it at smoke/triage scope. A shared relaxed
    100-LFB compare, qwen3-instruct-q4q8-lfb100-20260609T091700Z, later passed
    18/18 formal plus 1/1 fake-stream at 34.865 text tok/s, 31.958 image
    tok/s, and 1.827 s fake-stream latency with post-prepare preflight
    `lfb 121x4MB`, but its prepare delta was effectively flat (`lfb -1`,
    `MemAvailable +1.816 MB`). The Q8 fallback lane now exists, but it also
    fails the conservative 150-LFB preflight gate and only has relaxed-gate
    smoke evidence so far.
